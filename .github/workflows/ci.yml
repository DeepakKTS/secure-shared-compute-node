---
# Lint and unit tests. CI runs the same make targets as a local run.
# The lab itself (VMs, eBPF, systemd) cannot run here; see docs/TESTING.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install pinned deps
        run: make deps
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
