# Ansible settings for this repo. Run ansible from the repo root (make does).

[defaults]
# Point at the generated file, not the inventory/ directory: as a directory,
# Ansible would also try to parse lab.yml.example with the INI plugin.
# group_vars still load from inventory/group_vars/.
inventory = inventory/lab.yml
roles_path = roles
collections_path = .ansible/collections
# Lab hosts get ansible_python_interpreter from the generated inventory.
# Implicit localhost keeps the controller's own Python.
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
nocows = True

[ssh_connection]
# ControlPersist reuses connections. After an sshd change, use
# meta: reset_connection so the next check opens a new connection.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
