---
# Tunables. These are lab starting values. DASH values must be agreed with the owner.
# Keep secrets out of this file.

admin_user: ssc-admin

# Time and kernel settings from roles/base (reasons in roles/base/defaults/main.yml).
base_timezone: Etc/UTC                  # logs and alert times in one zone
base_ntp_pools:                         # Ubuntu defaults; DASH would use campus NTP
  - {name: ntp.ubuntu.com, maxsources: 4}
  - {name: 0.ubuntu.pool.ntp.org, maxsources: 1}
  - {name: 1.ubuntu.pool.ntp.org, maxsources: 1}
  - {name: 2.ubuntu.pool.ntp.org, maxsources: 2}
base_chrony_makestep: "1 -1"            # lab: step on any offset over 1 s (laptop sleep); Ubuntu default is "1 3"
base_rp_filter: 1                       # strict; use 2 (loose) on multi-homed servers with asymmetric routing

users_research:
  - name: alice
  - name: bob
users_research_group: ssc-users

# Extra CIDRs allowed to SSH in. lab_cidr and lab_controller_ip are always allowed;
# both come from the generated inventory. Leave empty in the lab; set campus or VPN ranges on DASH.
firewall_admin_cidrs: []
firewall_egress_mode: log_and_drop      # log_and_drop | log_only
firewall_mining_ports: [3333, 3334, 4444, 5555, 7777, 14444]   # commonly seen stratum ports; a starting list, not complete

fail2ban_maxretry: 3
fail2ban_findtime: 10m
fail2ban_bantime: 1h

resource_limits_cpu_quota: "100%"       # one core per user in a 2 vCPU lab; keep above detection_cpu_threshold
resource_limits_memory_max: 768M
resource_limits_tasks_max: 512

# Matched against process-exporter group names "<comm>:<user>". Linux cuts comm to 15 characters,
# so process-exporter appears as process-exporte.
detection_process_allowlist_regex: "^(python3|jupyter[^:]*|node_exporter|process-exporte|falco[^:]*|sshd|systemd[^:]*):"
detection_cpu_threshold: 0.8            # cores, per process group
detection_cpu_for: 1m                   # lab value; recommend longer for DASH, see ADR 0006

prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s
alertmanager_group_wait: 5s

gpu_enabled: false
