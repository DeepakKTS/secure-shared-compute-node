---
# Settings for the compute node (the server being protected).

# Research users: {name, ssh_public_key}. Without ssh_public_key the lab makes
# a key pair in ~/.config/ssc-lab/keys/<name>_ed25519 (users_generate_lab_keys
# in all.yml).
# In the small profile the node is also in the monitor group; this file wins
# because Ansible applies same-level groups in name order (node after monitor).
users_research:
  - name: alice
  - name: bob

# /tmp is a tmpfs of this size (RAM). Lab node: 2 GB RAM. On DASH, size it to
# the machine, or give /tmp a disk partition with the same mount options.
tmp_hardening_tmp_size: 512M
