---
# Hardening and isolation, run by `make harden` (TAGS=<role> runs one role).
# Where each role runs is set in docs/PLAN.md, Phase 2. Roles are added here
# one Phase 2 task at a time.
- name: Base settings on every lab VM
  hosts: all
  roles:
    - role: base
      become: true
      tags: [base]

- name: Access controls on the node and the monitor
  hosts: node:monitor
  roles:
    - role: users
      become: true
      tags: [users]
    - role: ssh_hardening
      become: true
      tags: [ssh_hardening]
    - role: firewall
      become: true
      tags: [firewall]
