---
# Lab check, run at the end of `make lab-up`. Read-only: it changes nothing.
# Confirms every lab VM answers over SSH, runs Ubuntu 24.04 (ADR 0001), lets
# the admin use sudo (Ansible needs it), and keeps the `ubuntu` login that
# `multipass exec` uses: the user exists, is in `sudo` (so it passes
# AllowGroups and can repair the VM), and has its authorized_keys (CLAUDE.md
# rule 4). `scripts/lab.sh check` then proves `multipass exec` itself works.
# Reports architecture and kernel, and warns when the kernel has no BTF,
# which Falco's modern eBPF driver needs in Phase 5.
- name: Check the lab VMs
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until the VM accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - min

    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: >-
          {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}; the lab needs Ubuntu 24.04.
        quiet: true

    - name: Confirm passwordless sudo works for the admin user
      ansible.builtin.ping:
      become: true

    - name: Confirm the ubuntu user that multipass exec needs still exists
      ansible.builtin.getent:
        database: passwd
        key: ubuntu

    - name: Read the sudo group
      ansible.builtin.getent:
        database: group
        key: sudo

    - name: Require the ubuntu user in the sudo group
      ansible.builtin.assert:
        that:
          - "'ubuntu' in ansible_facts['getent_group']['sudo'][2].split(',')"
        fail_msg: >-
          {{ inventory_hostname }}: ubuntu is not in the sudo group. multipass exec
          could log in but not repair the VM, and AllowGroups would lock it out.
        quiet: true

    - name: Check the key multipass exec logs in with
      ansible.builtin.stat:
        path: "{{ ansible_facts['getent_passwd']['ubuntu'][4] }}/.ssh/authorized_keys"
      become: true
      register: lab_check_ubuntu_keys

    - name: Require a non-empty authorized_keys for ubuntu
      ansible.builtin.assert:
        that:
          - lab_check_ubuntu_keys.stat.exists
          - lab_check_ubuntu_keys.stat.size > 0
        fail_msg: >-
          {{ inventory_hostname }}: ubuntu has no authorized_keys, so multipass exec
          cannot log in.
        quiet: true

    - name: Check for kernel BTF
      ansible.builtin.stat:
        path: /sys/kernel/btf/vmlinux
      register: lab_check_btf

    - name: Report architecture and kernel
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['architecture'] }},
          kernel {{ ansible_facts['kernel'] }},
          BTF {{ 'present' if lab_check_btf.stat.exists else 'missing' }}

    - name: Warn when BTF is missing
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} has no /sys/kernel/btf/vmlinux.
          Falco's modern eBPF driver will not load; see ADR 0002.
      when: not lab_check_btf.stat.exists
