---
# Where unattended-upgrades may install from: security fixes only.
# - The release pocket is frozen on release day, so it brings no feature
#   changes. It stays because a security fix can need a new dependency that
#   only the release pocket has.
# - The security pocket.
# - Ubuntu Pro's security pockets. They apply only on a machine attached to
#   Pro (free for a few machines, and many universities have it).
# Not -updates, -proposed or -backports: those change features, and the admin
# schedules them.
auto_updates_origins:
  - "${distro_id}:${distro_codename}"
  - "${distro_id}:${distro_codename}-security"
  - "${distro_id}ESMApps:${distro_codename}-apps-security"
  - "${distro_id}ESM:${distro_codename}-infra-security"

# Report mail. Empty means none. Mail needs a working mail setup on the host,
# which this role does not install. Set in inventory/group_vars/all.yml.
auto_updates_mail: ""
auto_updates_mail_report: on-change   # always | only-on-error | on-change

# Days between cleanups of downloaded package files, so /var/cache/apt does
# not fill the disk.
auto_updates_autoclean_days: 7
