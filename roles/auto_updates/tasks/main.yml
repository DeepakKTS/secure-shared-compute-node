---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# A syntax error in apt.conf.d stops every apt command, security updates
# included, so each file is parsed with apt-config before it is written.
# apt-config catches a missing ";" or an open string; the tests check the
# parsed values.
- name: Write the periodic and unattended-upgrades settings
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/apt-config -c %s dump
  loop:
    - 20auto-upgrades
    - 52ssc-unattended-upgrades

# The timers start the daily runs. unattended-upgrades.service holds a
# shutdown until a running upgrade has finished, so a reboot never leaves
# dpkg half done.
- name: Run the apt timers and the shutdown guard now and at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - unattended-upgrades.service
