---
- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

# systemd-sysctl applies every sysctl.d file, including glob keys.
- name: Apply sysctl settings
  ansible.builtin.systemd_service:
    name: systemd-sysctl
    state: restarted

# The manager reads system.conf.d only when it starts; services started
# after this get the new default limits. A reboot covers the rest.
- name: Reexecute systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true
