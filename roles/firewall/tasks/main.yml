---
# Without these the ruleset would have no rule for the controller, and the
# next new connection would be dropped (CLAUDE.md rule 4).
- name: Require the controller address and the lab network
  ansible.builtin.assert:
    that:
      - lab_controller_ip is defined
      - lab_controller_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
      - lab_cidr is defined
      - lab_cidr is match('^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$')
    fail_msg: >-
      lab_controller_ip and lab_cidr must come from the generated inventory
      (make lab-up). Refusing to write a firewall that could lock out the controller.
    quiet: true

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

# One tool manages the firewall. ufw is preinstalled; it is inactive in the
# cloud image, and masking keeps it from loading rules at boot.
- name: Look for ufw
  ansible.builtin.stat:
    path: /etc/ufw/ufw.conf
  register: firewall_ufw

- name: Keep ufw switched off in its config
  ansible.builtin.lineinfile:
    path: /etc/ufw/ufw.conf
    regexp: "^ENABLED="
    line: ENABLED=no
  when: firewall_ufw.stat.exists

- name: Stop and disable ufw
  ansible.builtin.systemd_service:
    name: ufw
    state: stopped
    enabled: false
  when: firewall_ufw.stat.exists

- name: Mask ufw
  ansible.builtin.systemd_service:
    name: ufw
    masked: true
  when: firewall_ufw.stat.exists

- name: Write the nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

# Loads the rules at boot. Started here on the first run; after that only
# reloaded, because this unit's stop and restart flush every table.
- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Load the ruleset now, so the check below uses it
  ansible.builtin.meta: flush_handlers

- name: Use a new SSH connection for the check
  ansible.builtin.meta: reset_connection

- name: Confirm a new admin connection works through the firewall
  ansible.builtin.ping:
